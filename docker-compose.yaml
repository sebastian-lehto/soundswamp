services:
  server:
    build: ./server
    container_name: soundswamp-app
    environment:
      - DATABASE_URL: ${DATABASE_URL}
      - JWT_SECRET: ${JWT_SECRET}
      - NODE_ENV: development
      - PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./server:/app
    develop:
      watch:
        - action: rebuild
          path: ./server/src
          ignore:
            - server/node_modules
            - server/uploads
  
  client:
    build: ./client
    ports:
      - "3000:3000"
    stdin_open: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
