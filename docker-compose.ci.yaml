version: '3.9'

services:
  db:
    image: postgres:15
    env_file: .env.ci
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: .env.ci
    ports:
      - "4000:4000"
    depends_on:
      - db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file: .env.ci
    command: npm run start
    ports:
      - "3000:3000"
    depends_on:
      - server

  client:
    image: cypress/included:15.1.0
    working_dir: /e2e
    volumes:
      - ./client:/e2e
    env_file: .env.ci
    depends_on:
      - frontend
    entrypoint: ""
    command: tail -f /dev/null

volumes:
  pgdata: