services:
  server:
    build: ./server
    container_name: soundswamp-server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  client:
    build: ./client
    container_name: soundswamp-client
    environment:
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    command: tail -f /dev/null   # keep container alive for CI
    depends_on:
      - server

  db:
    image: postgres:13-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: