name: Run Cypress Tests with Docker Compose

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start containers
        run: |
          docker-compose -f docker-compose.ci.yaml up -d --build
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for services to be ready
        run: |
          sleep 40
          docker-compose -f docker-compose.ci.yaml ps

      - name: Run Cypress tests
        run: |
          docker-compose -f docker-compose.ci.yaml exec -T client npx cypress run --config-file cypress.config.ts

      - name: Stop containers
        if: always()
        run: docker-compose -f docker-compose.ci.yaml down